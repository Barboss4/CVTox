<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Inscrições | CVTox</title>

  <link rel="icon" href="assets/img/cvtox-logo.png">
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="data/site.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>

<body data-page="inscricoes" data-base="">

  <div data-site-header></div>

  <main>

    <!-- Cabeçalho -->
    <section class="page-hero">
      <div class="container">

        <p class="eyebrow">Participação</p>

        <h1>Inscrições</h1>

        <p>
          Confira as principais informações para participar
          do IX Curso de Verão de Toxicologia.
        </p>

      </div>
    </section>


    <!-- Informações da inscrição -->
    <section class="section">
      <div class="container">

        <div class="info-card">

          <p class="eyebrow">Próxima edição</p>

          <h2 data-event-edition></h2>

          <p>
            <strong>Data:</strong>
            <span data-event-date></span>

            <br>

            <strong>Local:</strong>
            <span data-event-location></span>
          </p>


          <!-- Valor -->
          <div class="registration-price">

            <span>Valor da inscrição</span>

            <strong data-registration-price>
              A definir
            </strong>

            <p data-registration-price-note>
              O valor da inscrição será divulgado em breve.
            </p>

          </div>


          <!-- Botão -->
          <div class="actions">

            <a
              class="btn btn-primary"
              data-registration-cta
              href="#"
            >
              Inscrições em breve
            </a>

          </div>

        </div>

      </div>
    </section>

  </main>

  <div data-site-footer></div>

</body>
</html>
